<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ulm 1500</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }

  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(12,10,6,0.30) 100%),
      linear-gradient(to bottom, rgba(18,16,10,0.16) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 74%, rgba(16,12,6,0.30) 100%);
  }

  .capbg {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
    background: linear-gradient(to top, rgba(10,8,4,0.55) 0%, rgba(10,8,4,0.26) 42%, rgba(0,0,0,0) 100%);
    opacity: 0;
  }
  .cap {
    position: absolute; left: 6.2%; right: 32%; bottom: 8.4%;
    font-family: 'Bitstream Charter', 'DejaVu Serif', Georgia, serif;
    font-size: 25px; line-height: 1.46; color: #f6f1e4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 26px rgba(0,0,0,0.6);
    opacity: 0; transition: none;
    border-left: 2px solid rgba(233,220,188,0.65);
    padding-left: 20px;
  }
  .cap i { font-style: italic; color: #ecdfbf; }

  .card {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; opacity: 0;
    font-family: 'Bitstream Charter', 'DejaVu Serif', Georgia, serif; color: #f7f2e6;
    text-shadow: 0 2px 10px rgba(0,0,0,0.75);
  }
  .card .ctitle { font-size: 86px; letter-spacing: 0.30em; margin-right: -0.30em; font-weight: 400; }
  .card .csub { font-size: 27px; letter-spacing: 0.10em; margin-top: 20px; opacity: 0.94; text-align: center; line-height: 1.5; }
  .card .cnote { font-size: 19px; letter-spacing: 0.06em; margin-top: 26px; opacity: 0.74; font-style: italic; }
  .card.end .ctitle { font-size: 52px; letter-spacing: 0.16em; }
  .card::before {
    content: ''; position: absolute; width: 220px; height: 1px; top: calc(50% - 116px);
    background: linear-gradient(to right, transparent, rgba(240,230,205,0.6), transparent);
  }
  .card::after {
    content: ''; position: absolute; width: 220px; height: 1px; bottom: calc(50% - 126px);
    background: linear-gradient(to right, transparent, rgba(240,230,205,0.6), transparent);
  }
</style>
</head>
<body>
<script type="module" src="./js/main.js"></script>
</body>
</html>
